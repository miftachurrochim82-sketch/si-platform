<!-- ==================== A2_Header.html — App Header ==================== -->
<header class="h-16 bg-white border-b border-slate-200/80 flex items-center justify-between px-4 md:px-6 shrink-0 dark:bg-slate-800 dark:border-slate-700 shadow-sm z-10">
  <div class="flex items-center gap-3">
    <button @click="toggleSidebar" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-700 md:hidden">
      <i class="fa-solid fa-bars text-lg"></i>
    </button>
    <h1 class="text-base sm:text-lg font-extrabold text-slate-800 flex items-center gap-2.5 dark:text-white">
      <i :class="currentMenuIcon" class="text-emerald-600 dark:text-emerald-400 text-sm sm:text-base"></i>
      <span>{{ currentPageLabel }}</span>
    </h1>
  </div>
  
  <div class="flex items-center gap-2 md:gap-3">
    <button v-if="['users','audit','files','roles','permissions','settings','notifications'].includes(currentPage)" @click="exportCSV(currentPage)" class="btn btn-secondary hidden sm:flex text-xs">
      <i class="fa-solid fa-file-csv text-emerald-600"></i> Ekspor CSV
    </button>
    
    <div class="h-5 w-px bg-slate-200 dark:bg-slate-700 hidden md:block"></div>

    <button @click="fetchData(true)" class="p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors text-emerald-600 dark:text-emerald-400" title="Muat Ulang Data">
      <i class="fa-solid fa-rotate text-sm" :class="{'animate-spin': isSyncing}"></i>
    </button>

    <button @click="toggleDarkMode" class="p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors text-slate-600 dark:text-slate-300" :title="isDarkMode ? 'Mode Terang' : 'Mode Gelap'">
      <i :class="isDarkMode ? 'fa-solid fa-sun text-amber-500 text-sm' : 'fa-solid fa-moon text-slate-400 text-sm'"></i>
    </button>

    <div class="flex items-center gap-2 pl-2">
      <div class="text-right hidden md:block">
        <p class="text-xs font-bold text-slate-900 dark:text-white leading-tight">{{ (session.user && session.user.display_name) || 'Administrator' }}</p>
        <p class="text-[10px] text-slate-500 dark:text-slate-400 max-w-[140px] truncate" :title="(session.user && session.user.email) || ''">{{ (session.user && session.user.email) || '' }}</p>
      </div>
      <div class="w-8 h-8 rounded-xl bg-emerald-500/10 text-emerald-600 border border-emerald-500/20 flex items-center justify-center font-bold text-xs uppercase dark:bg-emerald-950 dark:text-emerald-400 dark:border-emerald-800">
        {{ ((session.user && session.user.email) || 'AD').substring(0,2) }}
      </div>
    </div>
  </div>
</header>
