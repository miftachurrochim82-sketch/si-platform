<!-- ==================== A3_Aplikasi.html — Portal Aplikasi View ==================== -->
<div v-if="currentPage === 'apps' && !loading" class="space-y-6">
  <div v-if="data.apps.length" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
    <div v-for="app in data.apps" :key="app.code" class="card p-5 flex flex-col gap-3 hover:shadow-md hover:border-emerald-500/30 transition-all group">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 text-emerald-600 flex items-center justify-center dark:bg-emerald-950 dark:text-emerald-400 border border-emerald-500/20 group-hover:scale-105 transition-transform">
          <i :class="app.icon" class="text-xl"></i>
        </div>
        <div class="truncate">
          <h3 class="font-extrabold text-sm text-slate-900 dark:text-white truncate">{{ app.name }}</h3>
          <p class="text-[10px] font-mono font-bold text-emerald-600 dark:text-emerald-400">{{ app.code }}</p>
        </div>
      </div>
      <p class="text-xs text-slate-600 dark:text-slate-300 flex-1 leading-relaxed">{{ app.description }}</p>
      <button 
        @click="openApp(app)" 
        class="btn btn-primary w-full text-xs font-bold"
        :disabled="!app.url || app.url.includes('PASTE_APP_URL')">
        <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i> Buka Aplikasi
      </button>
    </div>
  </div>
  <div v-else class="empty-state">
    <i class="fa-solid fa-shapes text-4xl mb-2 text-slate-300 dark:text-slate-600"></i>
    <p class="text-xs font-semibold">Tidak ada aplikasi terdaftar.</p>
  </div>
</div>
