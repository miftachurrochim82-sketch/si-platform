<!-- ==================== A1_Sidebar.html — Navigation Sidebar ==================== -->
<aside class="bg-slate-900 text-white flex flex-col transition-all duration-300 z-30 shrink-0 shadow-2xl fixed md:relative h-full border-r border-slate-800"
       :class="[sidebarCollapsed ? '-translate-x-full md:translate-x-0 md:w-20' : 'translate-x-0 w-64']">
  <div class="flex items-center justify-between h-16 px-4 border-b border-slate-800 bg-slate-950">
    <div v-show="!sidebarCollapsed || isMobile" class="flex items-center gap-2.5 font-extrabold text-sm tracking-wide truncate w-full text-emerald-400">
      <div class="w-8 h-8 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 shrink-0">
        <i class="fa-solid fa-shield-halved text-base"></i>
      </div>
      <div class="truncate leading-tight">
        <span class="block text-white font-bold text-xs">SI-PLATFORM</span>
        <span class="block text-[10px] text-slate-400 font-medium">Pemkab Trenggalek</span>
      </div>
    </div>
    <button @click="toggleSidebar" class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-colors mx-auto hidden md:block" :title="sidebarCollapsed ? 'Perluas Menu' : 'Ciutkan Menu'">
      <i :class="sidebarCollapsed ? 'fa-solid fa-bars text-sm' : 'fa-solid fa-chevron-left text-xs'"></i>
    </button>
  </div>

  <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
    <button v-for="item in allowedMenuItems" :key="item.key" 
            @click="switchPage(item.key)" 
            class="nav-item group" 
            :class="{ 'active': currentPage === item.key, 'md:justify-center md:px-0': sidebarCollapsed }"
            :title="item.label">
      <i :class="item.icon" class="text-sm shrink-0 group-hover:scale-110 transition-transform w-5 text-center"></i>
      <span v-show="!sidebarCollapsed || isMobile" class="truncate">{{ item.label }}</span>
    </button>
  </nav>

  <div class="p-3 border-t border-slate-800 bg-slate-950">
    <button @click="confirmLogout" class="w-full flex items-center justify-center gap-2.5 p-2.5 rounded-xl bg-rose-500/10 text-rose-400 hover:bg-rose-600 hover:text-white transition-all text-xs font-bold" :class="sidebarCollapsed && !isMobile ? 'px-0' : ''" title="Logout">
      <i class="fa-solid fa-right-from-bracket text-sm"></i>
      <span v-show="!sidebarCollapsed || isMobile">Keluar</span>
    </button>
  </div>
</aside>
