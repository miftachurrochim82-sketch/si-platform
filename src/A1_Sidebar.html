<!-- ==================== A1_Sidebar.html — Modern Enterprise Navigation Sidebar ==================== -->
<aside class="bg-gradient-to-b from-slate-900 via-slate-900 to-indigo-950 text-slate-100 flex flex-col transition-all duration-300 z-30 shrink-0 shadow-2xl fixed md:relative h-full border-r border-slate-800/80 select-none"
       :class="[sidebarCollapsed ? '-translate-x-full md:translate-x-0 md:w-20' : 'translate-x-0 w-64']">
  
  <!-- Top Brand Header -->
  <div class="flex items-center justify-between h-20 px-4 border-b border-slate-800/80 bg-slate-950/60 backdrop-blur-md shrink-0">
    <div v-show="!sidebarCollapsed || isMobile" class="flex items-center gap-3 font-extrabold text-sm tracking-wide truncate w-full animate-fade-in">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-600 via-teal-500 to-emerald-400 text-white shadow-lg shadow-emerald-500/20 flex items-center justify-center text-lg shrink-0 border border-emerald-400/30">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <div class="truncate leading-tight">
        <div class="flex items-center gap-1.5">
          <span class="block text-white font-black text-sm tracking-tight">SI-PLATFORM</span>
          <span class="text-[9px] px-1.5 py-0.2 rounded-md bg-emerald-500/20 text-emerald-300 font-bold border border-emerald-500/30">PORTAL</span>
        </div>
        <span class="block text-[11px] text-emerald-400 font-semibold tracking-wide mt-0.5">Pemkab Trenggalek</span>
      </div>
    </div>
    
    <!-- Collapsed Brand Icon -->
    <div v-show="sidebarCollapsed && !isMobile" class="mx-auto">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-600 via-teal-500 to-emerald-400 text-white shadow-lg shadow-emerald-500/20 flex items-center justify-center text-lg shrink-0 border border-emerald-400/30 font-black">
        <i class="fa-solid fa-shield-halved text-base"></i>
      </div>
    </div>

    <!-- Toggle Collapse Button -->
    <button @click="toggleSidebar" class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/80 transition-colors mx-auto hidden md:block" :title="sidebarCollapsed ? 'Perluas Menu' : 'Ciutkan Menu'">
      <i :class="sidebarCollapsed ? 'fa-solid fa-bars text-sm' : 'fa-solid fa-chevron-left text-xs'"></i>
    </button>
  </div>

  <!-- Grouped Navigation Body -->
  <nav class="flex-1 overflow-y-auto py-5 px-3 space-y-6 no-scrollbar">
    <div v-for="(group, gIdx) in (allowedMenuGroups.length ? allowedMenuGroups : [{ title: 'Menu Utama', items: allowedMenuItems }])" :key="gIdx" class="space-y-1.5">
      <!-- Section Category Title -->
      <div v-if="group.title && (!sidebarCollapsed || isMobile)" class="px-3 pb-1 text-[10px] font-extrabold uppercase tracking-widest text-emerald-400/80 flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
        <span>{{ group.title }}</span>
      </div>
      
      <!-- Menu Items in Group -->
      <div class="space-y-1">
        <button v-for="item in group.items" :key="item.key" 
                @click="switchPage(item.key)" 
                class="relative flex items-center gap-3 w-full px-3.5 py-2.5 rounded-xl transition-all duration-200 text-xs sm:text-sm font-semibold group" 
                :class="[
                  currentPage === item.key 
                    ? 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-extrabold shadow-md shadow-emerald-950/50' 
                    : 'text-slate-300 hover:bg-slate-800/70 hover:text-white',
                  sidebarCollapsed && !isMobile ? 'justify-center px-0' : ''
                ]"
                :title="item.label">
          <div v-if="currentPage === item.key" class="absolute left-0 top-1.5 bottom-1.5 w-1 bg-emerald-300 rounded-r-full"></div>
          <i :class="item.icon" class="text-sm shrink-0 group-hover:scale-110 transition-transform w-5 text-center" :class="currentPage === item.key ? 'text-white' : 'text-slate-400 group-hover:text-emerald-400'"></i>
          <span v-show="!sidebarCollapsed || isMobile" class="truncate flex-1 text-left">{{ item.label }}</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Bottom Action Footer (Logout Only - Clean & Sharp) -->
  <div class="p-3.5 border-t border-slate-800/80 bg-slate-950/80 backdrop-blur-md shrink-0">
    <button @click="confirmLogout" 
            class="w-full flex items-center justify-center gap-2.5 py-3 px-4 rounded-xl bg-gradient-to-r from-rose-600 to-rose-700 hover:from-rose-500 hover:to-rose-600 text-white transition-all text-xs font-extrabold shadow-lg shadow-rose-950/40 active:scale-[0.98]" 
            :class="sidebarCollapsed && !isMobile ? 'px-0' : ''" 
            title="Keluar dari Portal">
      <i class="fa-solid fa-power-off text-sm"></i>
      <span v-show="!sidebarCollapsed || isMobile">Keluar Sesi Portal</span>
    </button>
  </div>
</aside>
