<!-- ==================== A0_Style.html — Styling Theme & Component Tokens ==================== -->
<style type="text/tailwindcss">
  @layer components {
    .btn {
      @apply inline-flex items-center justify-center gap-2 px-4 py-2 text-sm font-medium rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-1 disabled:opacity-50 disabled:cursor-not-allowed;
    }
    .btn-primary { @apply bg-brand-600 text-white hover:bg-brand-700 shadow-sm focus:ring-brand-500; }
    .btn-secondary { @apply bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 focus:ring-gray-200 dark:bg-gray-700 dark:border-gray-600 dark:text-gray-200 dark:hover:bg-gray-600; }
    .btn-danger { @apply bg-red-600 text-white hover:bg-red-700 shadow-sm focus:ring-red-500; }
    .btn-link { @apply text-brand-600 bg-transparent hover:text-brand-800 hover:underline p-0 focus:ring-0 dark:text-brand-400; }

    .form-input { @apply w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm transition-colors focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 disabled:bg-gray-100 disabled:text-gray-500 dark:bg-gray-700 dark:border-gray-600 dark:text-gray-100 dark:disabled:bg-gray-600; }
    .form-label { @apply block text-sm font-medium text-gray-700 mb-1 dark:text-gray-300; }
    .card { @apply bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden dark:bg-gray-800 dark:border-gray-700; }

    .badge { @apply inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium; }

    .table-th { @apply px-4 py-3 bg-gray-50 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider border-b border-gray-200 whitespace-nowrap dark:bg-gray-700 dark:text-gray-300 dark:border-gray-600; }
    .table-td { @apply px-4 py-3 text-sm text-gray-700 border-b border-gray-100 whitespace-nowrap dark:text-gray-300 dark:border-gray-700; }

    .nav-item { @apply flex items-center gap-3 w-full px-3 py-2.5 mb-1 rounded-lg text-brand-100 hover:bg-brand-800 hover:text-white transition-all duration-200; }
    .nav-item.active { @apply bg-brand-700 text-white font-medium shadow-inner; }

    .modal-overlay { @apply fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm; }
    .modal-box { @apply bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh] dark:bg-gray-800 border dark:border-gray-700; }
    .modal-header { @apply px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50/50 dark:bg-gray-800 dark:border-gray-700; }
    .modal-footer { @apply px-6 py-4 border-t border-gray-200 bg-gray-50 flex justify-end gap-3 shrink-0 dark:bg-gray-800 dark:border-gray-700; }

    .skeleton { @apply animate-pulse bg-gray-200 rounded dark:bg-gray-700; }
    .empty-state { @apply text-center py-12 px-4; }
  }

  [v-cloak] { display: none; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  /* Transisi modal */
  .modal-enter-active, .modal-leave-active { transition: opacity 0.2s ease; }
  .modal-enter-from, .modal-leave-to { opacity: 0; }
  .modal-enter-active .modal-box, .modal-leave-active .modal-box { transition: transform 0.2s ease; }
  .modal-enter-from .modal-box, .modal-leave-to .modal-box { transform: scale(0.95); }

  /* Toast */
  .toast-enter-active, .toast-leave-active { transition: all 0.3s ease; }
  .toast-enter-from, .toast-leave-to { opacity: 0; transform: translateX(20px); }
</style>
