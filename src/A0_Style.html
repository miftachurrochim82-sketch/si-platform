<!-- ==================== A0_Style.html — Styling Theme & Component Tokens ==================== -->
<style type="text/tailwindcss">
  @layer components {
    .btn {
      @apply inline-flex items-center justify-center gap-2 px-4 py-2 text-xs sm:text-sm font-semibold rounded-xl transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-1 disabled:opacity-50 disabled:cursor-not-allowed shadow-sm;
    }
    .btn-primary { @apply bg-emerald-600 text-white hover:bg-emerald-700 shadow-emerald-600/20 focus:ring-emerald-500 active:scale-[0.98]; }
    .btn-secondary { @apply bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 focus:ring-slate-200 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-700 active:scale-[0.98]; }
    .btn-danger { @apply bg-rose-600 text-white hover:bg-rose-700 shadow-rose-600/20 focus:ring-rose-500 active:scale-[0.98]; }
    .btn-link { @apply text-emerald-600 bg-transparent hover:text-emerald-800 hover:underline p-0 focus:ring-0 dark:text-emerald-400 shadow-none; }

    .form-input { @apply w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-xs sm:text-sm transition-colors focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 disabled:bg-slate-100 disabled:text-slate-500 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100 dark:disabled:bg-slate-700; }
    .form-label { @apply block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5 dark:text-slate-300; }
    .card { @apply bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden dark:bg-slate-800 dark:border-slate-700/80; }

    .badge { @apply inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold tracking-wide; }

    .table-th { @apply px-4 py-3 bg-slate-50 text-left text-xs font-bold text-slate-600 uppercase tracking-wider border-b border-slate-200 whitespace-nowrap dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700; }
    .table-td { @apply px-4 py-3 text-xs sm:text-sm text-slate-700 border-b border-slate-100 whitespace-nowrap dark:text-slate-300 dark:border-slate-700/60; }

    .nav-item { @apply flex items-center gap-3 w-full px-3.5 py-2.5 mb-1 rounded-xl text-emerald-100/90 hover:bg-emerald-800 hover:text-white transition-all duration-200 text-xs sm:text-sm font-medium; }
    .nav-item.active { @apply bg-emerald-700 text-white font-bold shadow-sm; }

    .modal-overlay { @apply fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm; }
    .modal-box { @apply bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh] dark:bg-slate-800 border border-slate-200 dark:border-slate-700; }
    .modal-header { @apply px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/70 dark:bg-slate-800/90 dark:border-slate-700; }
    .modal-footer { @apply px-6 py-4 border-t border-slate-100 bg-slate-50/70 flex justify-end gap-2.5 shrink-0 dark:bg-slate-800/90 dark:border-slate-700; }

    .skeleton { @apply animate-pulse bg-slate-200 rounded-xl dark:bg-slate-700; }
    .empty-state { @apply text-center py-12 px-4 text-slate-400 dark:text-slate-500; }
  }

  [v-cloak] { display: none; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  /* Modal Transitions */
  .modal-enter-active, .modal-leave-active { transition: opacity 0.2s ease; }
  .modal-enter-from, .modal-leave-to { opacity: 0; }
  .modal-enter-active .modal-box, .modal-leave-active .modal-box { transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
  .modal-enter-from .modal-box, .modal-leave-to .modal-box { transform: scale(0.96); }

  /* Toast Transitions */
  .toast-enter-active, .toast-leave-active { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
  .toast-enter-from, .toast-leave-to { opacity: 0; transform: translateX(24px); }
</style>
