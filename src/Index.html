          },

          },

          },

          filters: {

          },
          roleSearch: '',
          permissionSearch: '',

          loading: false,

          loadedPages: {},

          showUserModal: false,
          userModalMode: 'create',
          userForm: { username: '', email: '', display_name: '', password: '', status: 'active' },
          editingUserId: null,

          showAssignRoles: false,
          selectedUser: null,
          availableRoles: [],

          showUploadModal: false,
          uploadData: { file_name: '', mime_type: '', data_base64: '', folder_id: '', file_size: 0 },
          uploading: false,

          showEditSetting: false,
          selectedSetting: null,
          editSettingValue: '',
          savingSetting: false,
          showSettingHistory: false,
          settingHistory: [],

          showSendNotificationModal: false,
          notificationForm: { template_code: '', subject: '', body: '', recipients: '', channel: 'email' },
          notificationVariables: {},
          sendingNotification: false,

          showTemplateModal: false,
          templateModalMode: 'create',
          templateForm: { code: '', name: '', channel: 'email', subject: '', body_template: '', variables: '' },
          editingTemplateId: null,
          savingTemplate: false,

          showAssignPermissions: false,
          selectedRole: null,
          availablePermissions: [],
          assignedPermissionIds: [],
          savingPermissions: false,

          showRoleModal: false,
          roleModalMode: 'create',
          roleForm: { code: '', name: '', scope: 'global', status: 'active' },
          editingRoleId: null,
          savingRole: false,

          selectedUsers: [],
          selectedFiles: [],
          sort: { key: '', order: 'asc' },
          sortFilesKey: '',
          sortFilesOrder: 'asc',
          sortAuditKey: '',
          sortAuditOrder: 'desc',
          sortRoleKey: '',
          sortRoleOrder: 'asc',

          _debounceTimer: null,
          pageSize: 10,
          currentPages: {
            users: 1,
            roles: 1,
            permissions: 1,
            audit: 1,
            settings: 1,
            files: 1,
            notifications: 1,
            templates: 1
          },
          fetchId: 0,
          auditTotalPages: 1,
          userTotalPages: 1,
          fileTotalPages: 1,
          notificationTotalPages: 1,
          settingTotalPages: 1
        };
      },

      computed: {
        currentPageLabel() {
          const item = this.menuItems.find(m => m.key === this.currentPage);
          return item ? item.label : '';
        },
        currentMenuIcon() {
          const item = this.menuItems.find(m => m.key === this.currentPage);
          return item ? item.icon : 'fa-solid fa-file';
        },
        allowedMenuItems() {
          const perms = this.session.user?.permissions;
          if (!Array.isArray(perms) || perms.length === 0) {
            return [];
          }
          return this.menuItems.filter(item => perms.includes(item.permission));
        },
        allowedMenuGroups() {
          const perms = this.session.user?.permissions;
          if (!Array.isArray(perms) || perms.length === 0) {
            return [];
          }
          return (this.menuGroups || []).map(group => ({
            title: group.title,
            items: (group.items || []).filter(item => perms.includes(item.permission))
          })).filter(group => group.items.length > 0);
        },
        displayableStats() {
          const { chartData, recentLogs, chart_data, recent_logs, ...numericStats } = this.dashboardStats || {};
          return numericStats;
        },
        templateVariables() {
          const tpl = this.data.notificationTemplates.find(t => t.code === this.notificationForm.template_code);
          if (!tpl || !tpl.variables) return [];
          return tpl.variables.split(',').map(v => v.trim()).filter(Boolean);
        },
        notificationPreview() {
          let body = this.notificationForm.body;
          if (!body) return '';
          this.templateVariables.forEach(v => {
            const regex = new RegExp('\\{\\{\\s*' + v + '\\s*\\}\\}', 'gi');
            body = body.replace(regex, this.notificationVariables[v] || '');
          });
          return body;
        },
        isUserFormValid() {
          if (this.userModalMode === 'create') {
            return (this.userForm.username?.length || 0) >= 3 && (this.userForm.email?.includes('@') || false) && (this.userForm.display_name?.length || 0) >= 3;
          }
          return (this.userForm.email?.includes('@') || false) && (this.userForm.display_name?.length || 0) >= 3;
        },
        isRoleFormValid() {
          if (this.roleModalMode === 'create') return (this.roleForm.code?.length || 0) >= 2 && (this.roleForm.name?.length || 0) >= 3;
          return (this.roleForm.name?.length || 0) >= 3;
        },
        isTemplateFormValid() {
          return (this.templateForm.code?.length || 0) >= 2 && (this.templateForm.name?.length || 0) >= 3;
        },
        allUsersSelected() {
          return (this.data.users?.length || 0) > 0 && this.selectedUsers.length === this.data.users.length;
        },
        allFilesSelected() {
          return (this.data.files?.length || 0) > 0 && this.selectedFiles.length === this.data.files.length;
        },
        sortedRoles() {
          const arr = this.data.roles || [];
          if (!this.sortRoleKey) return arr;
          const key = this.sortRoleKey;
          const order = this.sortRoleOrder === 'asc' ? 1 : -1;
          return [...arr].sort((a, b) => {
            let va = a[key] || '';
            let vb = b[key] || '';
            if (typeof va === 'string') va = va.toLowerCase();
            if (typeof vb === 'string') vb = vb.toLowerCase();
            return va > vb ? order : va < vb ? -order : 0;
          });
        },
        paginatedRoles() {
          const arr = this.sortedRoles || [];
          const start = (this.currentPages.roles - 1) * this.pageSize;
          return arr.slice(start, start + this.pageSize);
        },
        paginatedPermissions() {
          const arr = this.data.permissions || [];
          const start = (this.currentPages.permissions - 1) * this.pageSize;
          return arr.slice(start, start + this.pageSize);
        },
        paginatedTemplates() {
          const arr = this.data.notificationTemplates || [];
          const start = (this.currentPages.templates - 1) * this.pageSize;
          return arr.slice(start, start + this.pageSize);
        },
        paginatedSettings() {
          return Array.isArray(this.data.settings) ? this.data.settings : [];
        },
        paginatedNotifications() {
          return Array.isArray(this.data.notifications) ? this.data.notifications : [];
        },
        totalPages() {
          const clientPages = (arr) => Math.max(1, Math.ceil((arr?.length || 0) / this.pageSize));
          return {
            users: Math.max(1, Number(this.userTotalPages) || 1),
            files: Math.max(1, Number(this.fileTotalPages) || 1),
            audit: Math.max(1, Number(this.auditTotalPages) || 1),
            settings: Math.max(1, Number(this.settingTotalPages) || 1),
            notifications: Math.max(1, Number(this.notificationTotalPages) || 1),
            roles: clientPages(this.sortedRoles),
            permissions: clientPages(this.data.permissions),
            templates: clientPages(this.data.notificationTemplates)
          };
        }
      },

      mounted() {
        document.documentElement.classList.toggle('dark', this.isDarkMode);
        window.addEventListener('resize', this.handleResize);
        window.addEventListener('keydown', this.handleKeydown);
        this.handleResize();

        // Tangkap parameter redirect yang dikirim dari backend (doGet)
        if (this.redirectParam) {
          sessionStorage.setItem('platform_redirect', this.redirectParam);
        }

        // Jika sesi sudah tersimpan (refresh halaman), langsung arahkan ke halaman yang diminta
        if (this.session.token && this.session.user) {
          const redirect = sessionStorage.getItem('platform_redirect');
          const targetPage = redirect || 'apps';
          this.switchPage(targetPage);
          this.fetchData(true); // muat data dengan loading overlay
          sessionStorage.removeItem('platform_redirect'); // bersihkan setelah dipakai
        }
      },
      
      beforeUnmount() {
        window.removeEventListener('resize', this.handleResize);
        window.removeEventListener('keydown', this.handleKeydown);
        if (this.chartInstance) this.chartInstance.destroy();
      },

      methods: {
        handleResize() { 
          this.isMobile = window.innerWidth < 768;
          if(this.isMobile && this.session.token) {
             this.sidebarCollapsed = true;
          } else if (!this.isMobile && this.session.token) {
             this.sidebarCollapsed = false;
          }
        },
        handleKeydown(e) {
          if (e.key === 'Escape') {
            this.showUserModal = false; this.showUploadModal = false; this.showConfirm = false;
            this.showAssignRoles = false; this.showEditSetting = false; this.showSettingHistory = false;
            this.showSendNotificationModal = false; this.showAssignPermissions = false;
            this.showRoleModal = false; this.showTemplateModal = false;
          }
        },
        toggleDarkMode() {
          this.isDarkMode = !this.isDarkMode;
          document.documentElement.classList.toggle('dark', this.isDarkMode);
          localStorage.setItem('darkMode', this.isDarkMode);
          this.updateChart();
        },
        showToast(message, type = 'success') {
          const id = Date.now() + Math.random();
          this.toasts.push({ id, message, type });
          setTimeout(() => this.removeToast(id), 4000);
        },
        removeToast(id) { this.toasts = this.toasts.filter(t => t.id !== id); },
        askConfirm(message, action) {
          this.confirmMessage = message; this.confirmAction = action; this.showConfirm = true;
        },
        async executeConfirm() {
          const action = this.confirmAction;
          this.showConfirm = false; this.confirmAction = null;
          if (action) {
            try { await action(); } catch (e) { this.showToast(e?.message || e, 'error'); }
          }
        },
        formatDate(value) {
          if (!value) return '-';
          const date = new Date(value);
          return isNaN(date) ? String(value) : date.toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        },
        formatBytes(bytes) {
          const size = Number(bytes);
          if (!Number.isFinite(size) || size < 0) return '-';
          if (size === 0) return '0 B';
          const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
          const i = Math.min(Math.floor(Math.log(size) / Math.log(1024)), sizes.length - 1);
          return (size / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 2) + ' ' + sizes[i];
        },
        folderName(folderId) {
          const folder = this.data.folders.find(f => String(f.id) === String(folderId));
          return folder ? folder.name : 'Root';
        },
        getInitials(text) {
          const str = String(text || '').trim();
          return str ? str.substring(0, 2).toUpperCase() : 'US';
        },

        // =========================================================================
        // SSO REDIRECT: BUKA APLIKASI DI TAB BARU
        // =========================================================================
        async openApp(app) {
          if (!app.url || app.url.includes('PASTE_APP_URL')) {
            this.showToast('URL aplikasi belum diatur oleh Administrator', 'warning');
            return;
          }

          this.showToast(`Menghubungkan ke ${app.name}...`, 'success');

          try {
            const res = await this.callServer('POST', '/api/v1/auth/create-ticket', {
              userId: this.session.user.id,
              appCode: app.code
            });

            if (res.success && res.data && res.data.ticket) {
              const cleanUrl = String(app.url || '').replace(/^[+\s]+|[+\s]+$/g, '').trim();
              const sep = cleanUrl.includes('?') ? '&' : '?';
              const targetUrl = cleanUrl + sep + 'ticket=' + encodeURIComponent(res.data.ticket);
              window.open(targetUrl, '_blank');
            } else {
              throw new Error(res.error?.message || 'Gagal membuat tiket keamanan.');
            }
          } catch (e) {
            this.showToast(e.message, 'error');
          }
        },

        exportCSV(page) {
          let data = []; let filename = '';
          if (page === 'users') { data = this.data.users; filename = 'users_export.csv'; }
          else if (page === 'audit') { data = this.data.auditEvents; filename = 'audit_logs_export.csv'; }
          else if (page === 'files') { data = this.data.files; filename = 'files_export.csv'; }
          else if (page === 'roles') { data = this.data.roles; filename = 'roles_export.csv'; }
          else if (page === 'permissions') { data = this.data.permissions; filename = 'permissions_export.csv'; }
          else if (page === 'settings') { data = this.data.settings; filename = 'settings_export.csv'; }
          else if (page === 'notifications') { data = this.data.notifications; filename = 'notifications_export.csv'; }

          if (!data.length) { this.showToast('Tidak ada data untuk diekspor.', 'warning'); return; }
          const headers = Object.keys(data[0]);
          const csvRows = [headers.join(',')];
          data.forEach(row => {
            const values = headers.map(h => {
              const val = row[h] ?? '';
              return `"${String(val).replace(/"/g, '""')}"`;
            });
            csvRows.push(values.join(','));
          });
          const csvString = csvRows.join('\n');
          const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = filename;
          link.click();
          URL.revokeObjectURL(link.href);
        },

        callServer(method, path, data = {}, query = {}, includeToken = true) {
          return new Promise((resolve, reject) => {
            // Mekanisme Mock Server (Untuk test di luar GAS)
            if (typeof google === 'undefined' || !google.script || !google.script.run) {

                } else if (path === '/api/v1/dashboard/stats') {
                  resolve({ success: true, data: { totalUsers: 45, totalRoles: 6, totalPermissions: 32, totalFiles: 128, totalNotifications: 54, totalAuditEvents: 1042, chartData: { labels: ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'], datasets: [{ label: 'Aktivitas', data: [12, 19, 15, 25, 22, 30, 28], borderColor: '#10b981', fill: false }] }, recentLogs: [{ id: 101, action: 'LOGIN', resource_type: 'Auth', actor_id: 'admin@si-platform.dev', result: 'SUCCESS', timestamp: new Date().toISOString() }] } });
                } else if (path === '/api/v1/users') {
                  resolve({ success: true, data: [{ id: 1, username: 'admin', email: 'admin@si-platform.dev', display_name: 'Administrator', status: 'active', roles: ['admin'] }], meta: { total: 1, page: 1, pageSize: 10, totalPages: 1 } });
                } else if (path === '/api/v1/roles') {
                  resolve({ success: true, data: [{ id: 1, code: 'admin', name: 'Super Administrator', scope: 'global', status: 'active', permissions: ['user.read'] }] });
                } else if (path === '/api/v1/permissions') {
                  resolve({ success: true, data: [{ id: 1, resource: 'user', action: 'create', code: 'user.create', description: 'Membuat user' }] });
                } else if (path === '/api/v1/files') {
                  resolve({ success: true, data: [{ id: 1, original_name: 'Dokumen.pdf', folder_id: null, size: 2048576, created_at: new Date().toISOString() }], meta: { total: 1, page: 1, pageSize: 10, totalPages: 1 } });
                } else if (path === '/api/v1/folders') {

                } else if (path === '/api/v1/notifications') {
                  resolve({ success: true, data: [{ id: 1, subject: 'Welcome', status: 'sent', channel: 'email', created_at: new Date().toISOString() }], meta: { total: 1, page: 1, pageSize: 10, totalPages: 1 } });
                } else if (path === '/api/v1/notification-templates') {
                  resolve({ success: true, data: [{ id: 1, code: 'welcome_user', name: 'Email Welcome', channel: 'email', subject: 'Welcome' }] });
                } else if (path === '/api/v1/settings') {
                  resolve({ success: true, data: [{ id: 1, key: 'APP_CONFIG', value_json: '{"theme":"light"}', version: 3, updated_by: 'admin', updated_at: new Date().toISOString() }], meta: { total: 1, page: 1, pageSize: 10, totalPages: 1 } });
                } else if (path === '/api/v1/audit/events') {
                  resolve({ success: true, data: [{ id: 1, action: 'LOGIN', resource_type: 'Auth', actor_id: 'admin', result: 'SUCCESS', timestamp: new Date().toISOString() }], meta: { total: 1, page: 1, pageSize: 10, totalPages: 1 } });
                } else {
                  resolve({ success: true, data: [] });
                }
              }, 400);
              return;
            }

            const payload = { ...data };
            if (includeToken && this.session.token) payload.token = this.session.token;

            google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler((err) => {
                const message = err?.message || String(err) || 'Unknown error';
                if (this.session.token && /token|unauthor|auth/i.test(message)) {
                  this.logout();
                  this.showToast('Sesi berakhir, silakan login kembali.', 'warning');
                }
                reject(new Error(message));
              })
              .callApi(method, path, payload, query);
          });
        },

        async login() {
          this.loginLoading = true;
          this.loginError = '';
          try {
            const result = await this.callServer('POST', '/api/v1/auth/login', {}, {}, false);
            if (result?.success && result.data?.token && result.data?.user) {
              this.session.token = result.data.token;
              this.session.user = result.data.user;
              if (!Array.isArray(this.session.user.permissions)) this.session.user.permissions = [];
              
              sessionStorage.setItem('platform_token', this.session.token);
              sessionStorage.setItem('platform_user', JSON.stringify(this.session.user));

              this.showToast(`Selamat datang, ${this.session.user.display_name}!`, 'success');

              // ==== REDIRECT SETELAH LOGIN ====
              const redirect = sessionStorage.getItem('platform_redirect');
              if (redirect) {
                this.switchPage(redirect, true);
                sessionStorage.removeItem('platform_redirect');
              } else {
                this.switchPage('apps', true);
              }
            } else {
              this.loginError = result?.error?.message || 'Gagal masuk. Pastikan Anda sudah login dengan akun Google yang terdaftar.';
            }
          } catch (e) {
            this.loginError = 'Terjadi kesalahan: ' + e.message;
          } finally {
            this.loginLoading = false;
          }
        },

        switchPage(pageKey, forceReload = false) {
          this.currentPage = pageKey;
          if (this.isMobile) this.sidebarCollapsed = true;
          this.fetchData(forceReload);
          if (pageKey === 'dashboard') {
            this.$nextTick(() => { this.updateChart(); });
          }
        },
        toggleSidebar() { this.sidebarCollapsed = !this.sidebarCollapsed; },

        async fetchData(forceReload = false) {
          const fetchId = ++this.fetchId;
          const pageKey = this.currentPage;
          const hasCache = this.loadedPages[pageKey] === true;
          const showBlockingLoading = forceReload || !hasCache;
          this.loading = showBlockingLoading;
          this.isSyncing = !showBlockingLoading;
          this.errorMessage = '';

          try {
            switch (this.currentPage) {
              case 'dashboard': {
                const [statsRes, appsRes, healthRes] = await Promise.all([
                  this.callServer('GET', '/api/v1/dashboard/stats'),
                  this.callServer('GET', '/api/v1/apps'),
                  this.callServer('GET', '/api/v1/health')
                ]);
                if (fetchId === this.fetchId) {
                  if (statsRes.success) {
                    this.dashboardStats = statsRes.data || {};
                    this.$nextTick(() => { this.updateChart(); });
                  }
                  if (appsRes.success) this.data.apps = appsRes.data || [];
                  if (healthRes.success) this.healthStatus = healthRes.data || {};
                }
                break;
              }
              case 'apps': {
                const res = await this.callServer('GET', '/api/v1/apps');
                if (fetchId === this.fetchId) {
                  if (res.success) this.data.apps = res.data || [];
                  else this.errorMessage = res.error?.message || 'Gagal memuat daftar aplikasi.';
                }
                break;
              }
              case 'users': {
                const res = await this.callServer('GET', '/api/v1/users', {}, {
                  search: this.filters.users.search,
                  status: this.filters.users.status,
                  page: this.currentPages.users,
                  pageSize: this.pageSize,
                  sortBy: this.sort.key,
                  sortOrder: this.sort.order
                });
                if (fetchId === this.fetchId) {
                  if (res.success) { this.data.users = res.data || []; this.userTotalPages = res.meta?.totalPages || 1; this.selectedUsers = []; } 
                  else this.errorMessage = res.error?.message || 'Gagal memuat pengguna.';
                }
                break;
              }
              case 'roles': {
                const res = await this.callServer('GET', '/api/v1/roles', {}, { search: this.roleSearch });
                if (fetchId === this.fetchId) {
                  if (res.success) this.data.roles = res.data || [];
                  else this.errorMessage = res.error?.message || 'Gagal memuat roles.';
                }
                break;
              }
              case 'permissions': {
                const res = await this.callServer('GET', '/api/v1/permissions', {}, { search: this.permissionSearch });
                if (fetchId === this.fetchId) {
                  if (res.success) this.data.permissions = res.data || [];
                  else this.errorMessage = res.error?.message || 'Gagal memuat permissions.';
                }
                break;
              }
              case 'audit': {
                const res = await this.callServer('GET', '/api/v1/audit/events', {}, {
                  page: this.currentPages.audit,
                  pageSize: this.pageSize,
                  search: this.filters.audit.search,
                  result: this.filters.audit.result,
                  sortBy: this.sortAuditKey,
                  sortOrder: this.sortAuditOrder
                });
                if (fetchId === this.fetchId) {
                  if (res.success) { this.data.auditEvents = res.data || []; this.auditTotalPages = res.meta?.totalPages || 1; } 
                  else this.errorMessage = res.error?.message || 'Gagal memuat log audit.';
                }
                break;
              }
              case 'settings': {
                const res = await this.callServer('GET', '/api/v1/settings', {}, { page: this.currentPages.settings, pageSize: this.pageSize });
                if (fetchId === this.fetchId) {
                  if (res.success) { this.data.settings = res.data || []; this.settingTotalPages = res.meta?.totalPages || 1; } 
                  else this.errorMessage = res.error?.message || 'Gagal memuat pengaturan.';
                }
                break;
              }
              case 'files': {
                const [fRes, dRes] = await Promise.all([
                  this.callServer('GET', '/api/v1/files', {}, {
                    folder_id: this.filters.files.folder_id,
                    page: this.currentPages.files,
                    pageSize: this.pageSize,
                    sortBy: this.sortFilesKey,
                    sortOrder: this.sortFilesOrder
                  }),
                  this.callServer('GET', '/api/v1/folders')
                ]);
                if (fetchId === this.fetchId) {
                  if (fRes.success) { this.data.files = fRes.data || []; this.fileTotalPages = fRes.meta?.totalPages || 1; } 
                  else this.errorMessage = fRes.error?.message || 'Gagal memuat berkas.';
                  if (dRes.success) this.data.folders = dRes.data || [];
                }
                break;
              }
              case 'notifications': {
                const [nRes, tRes] = await Promise.all([
                  this.callServer('GET', '/api/v1/notifications', {}, { page: this.currentPages.notifications, pageSize: this.pageSize }),
                  this.callServer('GET', '/api/v1/notification-templates')
                ]);
                if (fetchId === this.fetchId) {
                  if (nRes.success) { this.data.notifications = nRes.data || []; this.notificationTotalPages = nRes.meta?.totalPages || 1; } 
                  else this.errorMessage = nRes.error?.message || 'Gagal memuat notifikasi.';
                  if (tRes.success) this.data.notificationTemplates = tRes.data || [];
                }
                break;
              }
            }

            if (fetchId === this.fetchId && !this.errorMessage) {
              this.loadedPages[pageKey] = true;
            }

          } catch (e) {
            if (fetchId === this.fetchId) this.errorMessage = 'Terjadi galat sistem: ' + e.message;
          } finally {
            if (fetchId === this.fetchId) {
              this.loading = false;
              this.isSyncing = false;
            }
          }
        },

        debouncedFetch() { clearTimeout(this._debounceTimer); this._debounceTimer = setTimeout(() => { this.currentPages.users = 1; this.fetchData(); }, 500); },
        debouncedFetchAudit() { clearTimeout(this._debounceTimer); this._debounceTimer = setTimeout(() => { this.currentPages.audit = 1; this.fetchData(); }, 500); },
        debouncedFetchRoles() { clearTimeout(this._debounceTimer); this._debounceTimer = setTimeout(() => { this.fetchData(); }, 500); },
        debouncedFetchPermissions() { clearTimeout(this._debounceTimer); this._debounceTimer = setTimeout(() => { this.fetchData(); }, 500); },

        sortBy(key) { if (this.sort.key === key) this.sort.order = this.sort.order === 'asc' ? 'desc' : 'asc'; else { this.sort.key = key; this.sort.order = 'asc'; } this.currentPages.users = 1; this.fetchData(); },
        sortFiles(key) { if (this.sortFilesKey === key) this.sortFilesOrder = this.sortFilesOrder === 'asc' ? 'desc' : 'asc'; else { this.sortFilesKey = key; this.sortFilesOrder = 'asc'; } this.currentPages.files = 1; this.fetchData(); },
        sortAudit(key) { if (this.sortAuditKey === key) this.sortAuditOrder = this.sortAuditOrder === 'asc' ? 'desc' : 'asc'; else { this.sortAuditKey = key; this.sortAuditOrder = 'desc'; } this.currentPages.audit = 1; this.fetchData(); },
        sortByRole(key) { if (this.sortRoleKey === key) this.sortRoleOrder = this.sortRoleOrder === 'asc' ? 'desc' : 'asc'; else { this.sortRoleKey = key; this.sortRoleOrder = 'asc'; } },

        nextPage(cat) {
          const serverSideTotals = { users: this.userTotalPages, files: this.fileTotalPages, audit: this.auditTotalPages, settings: this.settingTotalPages, notifications: this.notificationTotalPages };
          if (Object.prototype.hasOwnProperty.call(serverSideTotals, cat)) {
            const total = Math.max(1, Number(serverSideTotals[cat]) || 1);
            if (this.currentPages[cat] < total) { this.currentPages[cat]++; this.fetchData(); }
            return;
          }
          if (this.currentPages[cat] < (this.totalPages[cat] || 1)) { this.currentPages[cat]++; }
        },
        prevPage(cat) {
          const serverSideTotals = { users: this.userTotalPages, files: this.fileTotalPages, audit: this.auditTotalPages, settings: this.settingTotalPages, notifications: this.notificationTotalPages };
          if (Object.prototype.hasOwnProperty.call(serverSideTotals, cat)) {
            if (this.currentPages[cat] > 1) { this.currentPages[cat]--; this.fetchData(); }
            return;
          }
          if (this.currentPages[cat] > 1) { this.currentPages[cat]--; }
        },

        closeUserModal() { this.showUserModal = false; this.savingUser = false; },
        async saveUser() {

            const method = this.userModalMode === 'create' ? 'POST' : 'PATCH';
            const path = this.userModalMode === 'create' ? '/api/v1/users' : `/api/v1/users/${this.editingUserId}`;

            else throw new Error(result.error?.message || 'Gagal menyimpan');

        openUploadModal() { this.showUploadModal = true; this.uploadData = { file_name: '', mime_type: '', data_base64: '', folder_id: '', file_size: 0 }; this.$nextTick(() => { if (this.$refs.fileInput) this.$refs.fileInput.value = ''; }); },
        onFileSelected(e) { const file = e.target.files[0]; if (!file) return; if (file.size > 10 * 1024 * 1024) { this.showToast('Ukuran file tidak boleh lebih dari 10MB!', 'error'); e.target.value = ''; return; } this.processFile(file); },
        handleDrop(e) { const file = e.dataTransfer.files[0]; if (!file) return; if (file.size > 10 * 1024 * 1024) { this.showToast('Ukuran file tidak boleh lebih dari 10MB!', 'error'); return; } this.processFile(file); },
        processFile(file) {
          this.uploadData.file_size = file.size;
          const reader = new FileReader();
          reader.onload = (e) => { this.uploadData.file_name = file.name; this.uploadData.mime_type = file.type || 'application/octet-stream'; this.uploadData.data_base64 = e.target.result.split(',')[1]; };
          reader.onerror = () => this.showToast('Gagal membaca file dari sistem', 'error');
          reader.readAsDataURL(file);
        },
        async uploadFile() {
          this.uploading = true;
          try {
            const res = await this.callServer('POST', '/api/v1/files', this.uploadData);
            if (res.success) { this.showUploadModal = false; this.showToast('File berhasil diunggah'); this.loadedPages['files'] = false; this.fetchData(true); } 
            else throw new Error(res.error?.message || 'Upload dibatalkan karena kesalahan sistem');
          } catch (e) { this.showToast(e.message, 'error'); } finally { this.uploading = false; }
        },
        async downloadFile(fileId) {
          try {
            const res = await this.callServer('GET', `/api/v1/files/${fileId}/download`);
            if (res.success && res.data?.data_base64) {
              const byteCharacters = atob(res.data.data_base64);
              const byteNumbers = new Array(byteCharacters.length);
              for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
              }
              const byteArray = new Uint8Array(byteNumbers);
              const blob = new Blob([byteArray], { type: res.data.mime_type || 'application/octet-stream' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = res.data.file_name || 'download';
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(url);
              this.showToast('File berhasil diunduh', 'success');
            } else {
              throw new Error('Data file tidak tersedia');
            }
          } catch (e) { this.showToast(e.message, 'error'); }
        },
        deleteFile(fileId) {
          this.askConfirm('Hapus file ini permanen?', async () => {
            const res = await this.callServer('DELETE', `/api/v1/files/${fileId}`);
            if (res.success) { this.showToast('File dihapus'); this.loadedPages['files'] = false; this.fetchData(true); } else throw new Error(res.error?.message || 'Gagal hapus');
          });
        },
        toggleAllFiles(e) { this.selectedFiles = e.target.checked ? this.data.files.map(f => f.id) : []; },
        bulkDeleteFiles() {
          if (!this.selectedFiles.length) return;
          this.askConfirm(`Hapus permanen ${this.selectedFiles.length} file terpilih?`, async () => {
            for (const id of this.selectedFiles) await this.callServer('DELETE', `/api/v1/files/${id}`);
            this.showToast('Proses hapus massal selesai'); this.selectedFiles = []; this.loadedPages['files'] = false; this.fetchData(true);
          });
        },

        openEditSetting(setting) {
          this.selectedSetting = setting;
          try {
            const value = typeof setting.value_json === 'string' ? JSON.parse(setting.value_json) : setting.value_json;
            this.editSettingValue = JSON.stringify(value ?? null, null, 2);
          } catch (_) { this.editSettingValue = String(setting.value_json ?? ''); }
          this.showEditSetting = true;
        },
        async saveSetting() {
          this.savingSetting = true;
          try {
            const parsed = JSON.parse(this.editSettingValue);
            const res = await this.callServer('PATCH', `/api/v1/settings/${this.selectedSetting.key}`, { value: parsed });
            if (res.success) { this.showEditSetting = false; this.showToast('Konfigurasi sistem berhasil diperbarui'); this.loadedPages['settings'] = false; this.fetchData(true); } 
            else throw new Error(res.error?.message || 'Gagal');
          } catch (e) { this.showToast(e.message + ' (Pastikan format JSON valid)', 'error'); } finally { this.savingSetting = false; }
        },
        async openSettingHistory(key) {
          try {
            const res = await this.callServer('GET', `/api/v1/settings/${key}/history`);
            if (res.success) { this.selectedSetting = res.data.setting; this.settingHistory = res.data.versions || []; this.showSettingHistory = true; } 
            else throw new Error(res.error?.message || 'Gagal mengambil riwayat');
          } catch (e) { this.showToast(e.message, 'error'); }
        },

        openSendNotificationModal() { this.showSendNotificationModal = true; this.notificationForm = { template_code: '', subject: '', body: '', recipients: '', channel: 'email' }; this.notificationVariables = {}; this.sendingNotification = false; },
        onTemplateChange() {
          this.notificationVariables = {};
          const tpl = this.data.notificationTemplates.find(t => t.code === this.notificationForm.template_code);
          if (tpl) {
            this.notificationForm.subject = tpl.subject || this.notificationForm.subject;
            this.notificationForm.body = tpl.body_template || this.notificationForm.body;
          }
        },
        async sendNotification() {
          const recipients = this.notificationForm.recipients.split(',').map(s => s.trim()).filter(s => s);
          if (!recipients.length) { this.showToast('Penerima (Recipients) wajib diisi', 'warning'); return; }
          this.sendingNotification = true;
          try {
            const payload = {
              template_code: this.notificationForm.template_code || undefined,
              subject: this.notificationForm.subject,
              body: this.notificationForm.body,
              channel: this.notificationForm.channel,
              recipients: recipients.map(r => ({ type: this.notificationForm.channel, value: r })),
              variables: this.notificationVariables
            };
            const res = await this.callServer('POST', '/api/v1/notifications', payload);
            if (res.success) { this.showSendNotificationModal = false; this.showToast('Notifikasi berhasil dimasukkan ke antrean kirim'); this.loadedPages['notifications'] = false; this.fetchData(true); } 
            else throw new Error(res.error?.message || 'Gagal mengirim pesan');
          } catch (e) { this.showToast(e.message, 'error'); } finally { this.sendingNotification = false; }
        },
        openCreateTemplateModal() { this.templateModalMode = 'create'; this.templateForm = { code: '', name: '', channel: 'email', subject: '', body_template: '', variables: '' }; this.editingTemplateId = null; this.showTemplateModal = true; },
        openEditTemplateModal(tpl) { this.templateModalMode = 'edit'; this.templateForm = { code: tpl.code, name: tpl.name, channel: tpl.channel, subject: tpl.subject || '', body_template: tpl.body_template || '', variables: tpl.variables || '' }; this.editingTemplateId = tpl.id; this.showTemplateModal = true; },
        closeTemplateModal() { this.showTemplateModal = false; this.savingTemplate = false; },
        async saveTemplate() {
          this.savingTemplate = true;
          try {
            const method = this.templateModalMode === 'create' ? 'POST' : 'PATCH';
            const path = this.templateModalMode === 'create' ? '/api/v1/notification-templates' : `/api/v1/notification-templates/${this.editingTemplateId}`;
            const result = await this.callServer(method, path, this.templateForm);
            if (result.success) { this.showToast('Template berhasil disimpan!'); this.closeTemplateModal(); this.loadedPages['notifications'] = false; this.fetchData(true); } 
            else throw new Error(result.error?.message || 'Gagal menyimpan template');
          } catch (e) { this.showToast(e.message, 'error'); } finally { this.savingTemplate = false; }
        },

        updateChart() {
          if (this.currentPage !== 'dashboard') return;
          const canvas = document.getElementById('dashboardChart');
          if (!canvas) return;
          if (this.chartInstance) { this.chartInstance.destroy(); }
          const fallbackData = {
            labels: ['Belum Ada Data'],
            datasets: [{ label: 'Menunggu Server...', data: [0], borderColor: '#cbd5e1', fill: false }]
          };
          const chartData = this.dashboardStats.chartData || this.dashboardStats.chart_data || fallbackData;
          this.chartInstance = new Chart(canvas, {
            type: 'line',
            data: chartData,
            options: { 
              responsive: true, 
              maintainAspectRatio: false,
              interaction: { mode: 'index', intersect: false },
              plugins: { legend: { position: 'bottom', labels: { color: this.isDarkMode ? '#e2e8f0' : '#475569' } } },
              scales: {
                y: { beginAtZero: true, grid: { borderDash: [4, 4], color: this.isDarkMode ? '#334155' : '#e2e8f0' }, ticks: { color: this.isDarkMode ? '#94a3b8' : '#64748b' } },
                x: { grid: { display: false }, ticks: { color: this.isDarkMode ? '#94a3b8' : '#64748b' } }
              }
            }
          });
        }
      }
    });

    app.component('pagination-controls', {
      props: {
        category: String,
        currentPage: Number,
        totalPages: Number
      },
      emits: ['prev', 'next'],
      template: `
        <div class="px-4 py-3 border-t border-slate-200 dark:border-gray-700 flex items-center justify-between bg-slate-50/50 dark:bg-gray-800/50">
          <span class="text-xs font-medium text-slate-500 dark:text-slate-400">
            Halaman <span class="text-slate-900 dark:text-white font-semibold">{{ currentPage }}</span> dari <span class="text-slate-900 dark:text-white font-semibold">{{ totalPages }}</span>
          </span>
          <div class="flex gap-2">
            <button @click="$emit('prev')" :disabled="currentPage === 1" class="btn btn-secondary py-1 px-2.5 text-xs flex items-center gap-1 shadow-sm">
              <i class="fa-solid fa-chevron-left text-xs"></i> Prev
            </button>
            <button @click="$emit('next')" :disabled="currentPage >= totalPages" class="btn btn-secondary py-1 px-2.5 text-xs flex items-center gap-1 shadow-sm">
              Next <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>
          </div>
        </div>
      `
    });

    app.mount('#app');
  </script>
</body>
</html>
