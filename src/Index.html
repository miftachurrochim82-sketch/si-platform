<body class="bg-gray-50 text-gray-900 font-sans antialiased dark:bg-gray-900 dark:text-gray-100 selection:bg-brand-500 selection:text-white">
  <div id="app" v-cloak>
    
    <!-- ================= LAYOUT & MODULAR VIEWS ================= -->
    <?!= include('V_Layout'); ?>

    <!-- ================= MODALS ================= -->
    <teleport to="body">

      <!-- Confirm Dialog -->
      <transition name="modal">
        <div v-if="showConfirm" class="modal-overlay" @click.self="showConfirm=false; confirmAction=null">
          <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden text-center p-6 dark:bg-gray-800 border border-slate-200 dark:border-gray-700 transform transition-all scale-100">
            <div class="w-16 h-16 rounded-full bg-rose-50 border-4 border-rose-100 text-rose-500 flex items-center justify-center mx-auto mb-4 dark:bg-rose-900/30 dark:border-rose-900/50 dark:text-rose-400">
              <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-900 mb-2 dark:text-white">Konfirmasi Tindakan</h3>
            <p class="text-sm text-slate-500 mb-6 dark:text-slate-400 leading-relaxed">{{ confirmMessage }}</p>
            <div class="flex justify-center gap-3">
              <button @click="showConfirm=false; confirmAction=null" class="btn btn-secondary w-full py-2.5">Batal</button>
              <button @click="executeConfirm" class="btn btn-danger w-full py-2.5 font-bold">Ya, Lanjutkan</button>
            </div>
          </div>
        </div>
      </transition>

    </teleport>

    <!-- Toast -->
    <teleport to="body">
      <div class="fixed bottom-4 md:bottom-auto md:top-4 right-4 z-[100] flex flex-col gap-3 max-w-sm w-[calc(100%-2rem)] md:w-full pointer-events-none">
        <transition-group name="toast">
          <div v-for="toast in toasts" :key="toast.id" class="pointer-events-auto shadow-xl rounded-xl p-4 flex items-start justify-between border-l-4 bg-white text-slate-800 dark:bg-gray-800 dark:text-slate-200"
               :class="{'border-emerald-500': toast.type === 'success', 'border-rose-500': toast.type === 'error', 'border-amber-500': toast.type === 'warning'}">
            <div class="flex items-center gap-3">
              <i :class="{'fa-solid fa-circle-check text-emerald-500': toast.type === 'success', 'fa-solid fa-circle-xmark text-rose-500': toast.type === 'error', 'fa-solid fa-triangle-exclamation text-amber-500': toast.type === 'warning'}" class="text-xl drop-shadow-sm"></i>
              <span class="text-sm font-medium leading-tight">{{ toast.message }}</span>
            </div>
            <button @click="removeToast(toast.id)" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors ml-4"><i class="fa-solid fa-xmark"></i></button>
          </div>
        </transition-group>
      </div>
    </teleport>
    
  </div>
