    
    <!-- ================= LAYOUT & MODULAR VIEWS ================= -->
<!-- ==================== SHELL: Login Screen, Sidebar & Header ==================== -->

<!-- 1. AUTH SCREEN (LOGIN) -->
<div v-if="!session.token" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-emerald-50 via-white to-teal-50 p-4 relative overflow-hidden">
  <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-emerald-400/20 rounded-full blur-3xl"></div>
  <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-teal-300/25 rounded-full blur-3xl"></div>

  <div class="bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-2xl w-full max-w-md relative z-10 border border-slate-200/70">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-emerald-50 text-emerald-600 mb-4 shadow-inner">
        <i class="fa-solid fa-shield-halved text-4xl"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">SI-PLATFORM</h1>
      <p class="text-xs font-semibold text-emerald-700 mt-1 uppercase tracking-wider">Portal Single Sign-On & Hub Master</p>
      <p class="text-xs text-slate-500 mt-0.5">Pemerintah Kabupaten Trenggalek</p>
    </div>

    <!-- Form Login Manual -->
    <form @submit.prevent="loginWithPassword" class="space-y-4">
      <div>
        <label class="form-label">Email atau Username</label>
        <input 
          v-model="loginForm.identifier" 
          type="text" 
          class="form-input" 
          placeholder="nama@trenggalekkab.go.id atau username" 
          required
        >
      </div>
      <div>
        <label class="form-label">Password</label>
        <input 
          v-model="loginForm.password" 
          type="password" 
          class="form-input" 
          placeholder="********" 
          required
        >
      </div>
      <button 
        type="submit" 
        class="w-full btn btn-primary py-3 text-sm flex justify-center items-center gap-2" 
        :disabled="loginLoading"
      >
        <i v-if="!loginLoading" class="fa-solid fa-right-to-bracket text-base"></i>
        <i v-else class="fa-solid fa-circle-notch animate-spin text-base"></i>
        <span>{{ loginLoading ? 'Memproses Autentikasi...' : 'Masuk ke Portal' }}</span>
      </button>
    </form>

    <!-- Divider -->
    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-slate-200"></div>
      </div>
      <div class="relative flex justify-center text-xs">
        <span class="px-3 bg-white text-slate-400 font-semibold uppercase">atau</span>
      </div>
    </div>

    <!-- Login dengan Google -->
    <button type="button" 
      @click="login" 
      class="w-full btn btn-secondary py-3 text-sm flex justify-center items-center gap-2" 
      :disabled="loginLoading"
    >
      <i v-if="!loginLoading" class="fa-brands fa-google text-base text-rose-500"></i>
      <i v-else class="fa-solid fa-circle-notch animate-spin text-base"></i>
      <span>{{ loginLoading ? 'Menghubungkan...' : 'Login dengan Google SSO' }}</span>
    </button>

    <div v-if="loginError" class="mt-4 p-3 bg-rose-50 border border-rose-200 rounded-2xl flex items-start gap-2.5 text-rose-700 text-xs">
      <i class="fa-solid fa-circle-exclamation text-base shrink-0 mt-0.5"></i>
      <span>{{ loginError }}</span>
    </div>
  </div>
</div>

<!-- 2. MAIN APPLICATION SHELL (SIDEBAR & HEADER) -->
<div v-else class="flex h-screen overflow-hidden">
  
  <!-- Mobile Backdrop Overlay -->
  <div v-if="!sidebarCollapsed && isMobile" @click="sidebarCollapsed = true" class="fixed inset-0 bg-black/50 z-20 md:hidden backdrop-blur-sm transition-opacity"></div>

  <!-- Sidebar Navigation (komponen kit) -->
  <app-sidebar
    :collapsed="sidebarCollapsed"
    :mobile-open="!sidebarCollapsed"
    :dark="false"
    :current-page="currentPage"
    :user="session.user || {}"
    :brand="platformBrand"
    :menu="menuForKit"
    @navigate="switchPage"
    @toggle="toggleSidebar"
    @close="onCloseMobile"
    @logout="confirmLogout"
  ></app-sidebar>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col min-w-0 overflow-hidden relative bg-gray-50/50 dark:bg-gray-900/50 w-full">

    <!-- Top Header Bar (komponen kit) -->
    <app-header
      :dark="isDarkMode"
      app-title="SI-PLATFORM"
      :current-page="currentPage"
      :page-icons="pageIconsKit"
      :user="session.user || {}"
      @toggle-dark="toggleDarkMode"
      @toggle-mobile="toggleSidebar"
      @navigate="switchPage"
    ></app-header>
    <div class="flex justify-end items-center gap-2 px-4 md:px-6 pt-3">
      <button type="button" v-if="['users','audit','files','roles','permissions','settings','notifications'].includes(currentPage)" @click="exportCSV(currentPage)" class="btn btn-secondary text-xs">
        <i class="fa-solid fa-file-csv text-emerald-600"></i> Ekspor CSV
      </button>
      <button type="button" @click="fetchData(true)" class="p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors text-emerald-600 dark:text-emerald-400" title="Muat Ulang Data">
        <i class="fa-solid fa-rotate text-sm" :class="{'animate-spin': isSyncing}"></i>
      </button>
    </div>

    <!-- Global Error Banner -->
    <div v-if="errorMessage" class="m-6 mb-0 p-4 bg-rose-50 border-l-4 border-rose-500 rounded-r-xl flex items-start justify-between text-rose-700 shadow-sm dark:bg-rose-900/20 dark:text-rose-300">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-circle-exclamation text-lg"></i>
        <span class="font-medium text-sm">{{ errorMessage }}</span>
      </div>
      <button type="button" @click="errorMessage=''" class="text-rose-500 hover:text-rose-700 dark:text-rose-400 dark:hover:text-rose-200"><i class="fa-solid fa-xmark text-sm"></i></button>
    </div>

    <!-- Content Scrollable -->
    <div class="flex-1 overflow-y-auto p-4 md:p-6 relative">
      <div v-if="loading" class="absolute inset-0 bg-white/70 backdrop-blur-sm flex flex-col items-center justify-center z-10 dark:bg-gray-900/70">
        <i class="fa-solid fa-circle-notch animate-spin text-4xl text-emerald-600 mb-3"></i>
        <p class="text-slate-600 font-medium dark:text-slate-300 animate-pulse text-sm">Memuat data...</p>
      </div>
