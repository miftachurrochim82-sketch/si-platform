<script>
// ============================================================
// SI-PLATFORM - J_Helpers.html
// Utilitas murni & UI (format, sort, toast, navigasi, chart)
// ============================================================
window.SIPlatformHelpers = {
  methods: {
        handleResize() { 
          this.isMobile = window.innerWidth < 768;
          if(this.isMobile && this.session.token) {
             this.sidebarCollapsed = true;
          } else if (!this.isMobile && this.session.token) {
             this.sidebarCollapsed = false;
          }
        },
        handleKeydown(e) {
          if (e.key === 'Escape') {
            this.showUserModal = false; this.showUploadModal = false; this.showConfirm = false;
            this.showAssignRoles = false; this.showEditSetting = false; this.showSettingHistory = false;
            this.showSendNotificationModal = false; this.showAssignPermissions = false;
            this.showRoleModal = false; this.showTemplateModal = false;
          }
        },
        toggleDarkMode() {
          this.isDarkMode = !this.isDarkMode;
          document.documentElement.classList.toggle('dark', this.isDarkMode);
          safeLocal.setItem('darkMode', this.isDarkMode);
          },
        showToast(message, type = 'success') {
          const id = Date.now() + Math.random();
          this.toasts.push({ id, message, type });
          setTimeout(() => this.removeToast(id), 4000);
        },
        removeToast(id) { this.toasts = this.toasts.filter(t => t.id !== id); },
        askConfirm(message, action) {
          this.confirmMessage = message; this.confirmAction = action; this.showConfirm = true;
        },
        async executeConfirm() {
          const action = this.confirmAction;
          this.showConfirm = false; this.confirmAction = null;
          if (action) {
            try { await action(); } catch (e) { this.showToast(e?.message || e, 'error'); }
          }
        },
        confirmLogout() { this.askConfirm('Apakah Anda yakin ingin keluar dari aplikasi?', () => { this.logout(); }); },
        
        formatDate(value) {
          if (!value) return '-';
          const date = new Date(value);
          return isNaN(date) ? String(value) : date.toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        },
        formatBytes(bytes) {
          const size = Number(bytes);
          if (!Number.isFinite(size) || size < 0) return '-';
          if (size === 0) return '0 B';
          const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
          const i = Math.min(Math.floor(Math.log(size) / Math.log(1024)), sizes.length - 1);
          return (size / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 2) + ' ' + sizes[i];
        },
        folderName(folderId) {
          const folder = this.data.folders.find(f => String(f.id) === String(folderId));
          return folder ? folder.name : 'Root';
        },
        getInitials(text) {
          const str = String(text || '').trim();
          return str ? str.substring(0, 2).toUpperCase() : 'US';
        },

        // =========================================================================
        // SSO REDIRECT: BUKA APLIKASI DI TAB BARU
        // =========================================================================
        switchPage(pageKey, forceReload = false) {
          this.currentPage = pageKey;
          if (this.isMobile) this.sidebarCollapsed = true;
          this.fetchData(forceReload);
        },
        toggleSidebar() { this.sidebarCollapsed = !this.sidebarCollapsed; },

        sortBy(key) { if (this.sort.key === key) this.sort.order = this.sort.order === 'asc' ? 'desc' : 'asc'; else { this.sort.key = key; this.sort.order = 'asc'; } this.currentPages.users = 1; this.fetchData(); },
        sortFiles(key) { if (this.sortFilesKey === key) this.sortFilesOrder = this.sortFilesOrder === 'asc' ? 'desc' : 'asc'; else { this.sortFilesKey = key; this.sortFilesOrder = 'asc'; } this.currentPages.files = 1; this.fetchData(); },
        sortAudit(key) { if (this.sortAuditKey === key) this.sortAuditOrder = this.sortAuditOrder === 'asc' ? 'desc' : 'asc'; else { this.sortAuditKey = key; this.sortAuditOrder = 'desc'; } this.currentPages.audit = 1; this.fetchData(); },
        sortByRole(key) { if (this.sortRoleKey === key) this.sortRoleOrder = this.sortRoleOrder === 'asc' ? 'desc' : 'asc'; else { this.sortRoleKey = key; this.sortRoleOrder = 'asc'; } },

        goToPage(cat, p) {
          const serverSide = { users: 'userTotalPages', files: 'fileTotalPages', audit: 'auditTotalPages', settings: 'settingTotalPages', notifications: 'notificationTotalPages' };
          if (Object.prototype.hasOwnProperty.call(serverSide, cat)) {
            const total = Math.max(1, Number(this[serverSide[cat]]) || 1);
            const np = Math.min(Math.max(1, p), total);
            if (np !== this.currentPages[cat]) { this.currentPages[cat] = np; this.fetchData(); }
            return;
          }
          const totalC = Math.max(1, this.totalPages[cat] || 1);
          this.currentPages[cat] = Math.min(Math.max(1, p), totalC);
        },
        nextPage(cat) {
          const serverSideTotals = { users: this.userTotalPages, files: this.fileTotalPages, audit: this.auditTotalPages, settings: this.settingTotalPages, notifications: this.notificationTotalPages };
          if (Object.prototype.hasOwnProperty.call(serverSideTotals, cat)) {
            const total = Math.max(1, Number(serverSideTotals[cat]) || 1);
            if (this.currentPages[cat] < total) { this.currentPages[cat]++; this.fetchData(); }
            return;
          }
          if (this.currentPages[cat] < (this.totalPages[cat] || 1)) { this.currentPages[cat]++; }
        },
        prevPage(cat) {
          const serverSideTotals = { users: this.userTotalPages, files: this.fileTotalPages, audit: this.auditTotalPages, settings: this.settingTotalPages, notifications: this.notificationTotalPages };
          if (Object.prototype.hasOwnProperty.call(serverSideTotals, cat)) {
            if (this.currentPages[cat] > 1) { this.currentPages[cat]--; this.fetchData(); }
            return;
          }
          if (this.currentPages[cat] > 1) { this.currentPages[cat]--; }
        },

        // --- CRUD OPERATIONS ---
        toggleAllUsers(e) { this.selectedUsers = e.target.checked ? this.data.users.map(u => u.id) : []; },
        toggleAllFiles(e) { this.selectedFiles = e.target.checked ? this.data.files.map(f => f.id) : []; },
  }
};
</script>
