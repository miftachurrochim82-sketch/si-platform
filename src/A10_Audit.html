<!-- ==================== A10_Audit.html — Audit Trail Log View ==================== -->
<div v-if="currentPage === 'audit' && !loading" class="space-y-4">
  <div class="flex flex-col sm:flex-row gap-3 bg-white p-4 rounded-xl shadow-sm border border-gray-200 dark:bg-gray-800 dark:border-gray-700">
    <div class="relative flex-1 sm:w-64">
      <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
      <input v-model="filters.audit.search" @input="debouncedFetchAudit" placeholder="Cari actor atau resource..." class="form-input pl-10 bg-gray-50 dark:bg-gray-900" />
    </div>
    <select v-model="filters.audit.result" @change="fetchData" class="form-input sm:w-40 bg-gray-50 dark:bg-gray-900">
      <option value="">Semua Hasil</option>
      <option value="SUCCESS">Sukses</option>
      <option value="FAILED">Gagal</option>
    </select>
  </div>
  <div class="card overflow-x-auto">
    <table class="min-w-full">
      <thead>
        <tr>
          <th class="table-th cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-600" @click="sortAudit('timestamp')">Waktu <i class="ph ph-arrows-down-up text-xs ml-1"></i></th>
          <th class="table-th">Pelaku (Actor)</th>
          <th class="table-th">Tindakan (Action)</th>
          <th class="table-th">Target (Resource)</th>
          <th class="table-th">Status</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100 dark:divide-gray-700">
        <tr v-if="!data.auditEvents.length">
          <td colspan="5" class="empty-state">
            <i class="ph ph-list-magnifying-glass text-4xl mb-2 text-gray-400"></i>
            <p>Tidak ada audit event.</p>
          </td>
        </tr>
        <tr v-for="ev in data.auditEvents" :key="ev.id" class="hover:bg-gray-50 dark:hover:bg-gray-700/50">
          <td class="table-td text-gray-500 dark:text-gray-400 text-xs">{{ formatDate(ev.timestamp) }}</td>
          <td class="table-td font-medium text-gray-900 dark:text-white">{{ ev.actor_id }}</td>
          <td class="table-td text-gray-500 dark:text-gray-400"><span class="px-2 py-0.5 bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-600 rounded text-xs font-mono">{{ ev.action }}</span></td>
          <td class="table-td text-gray-500 dark:text-gray-400">{{ ev.resource_type }} <span v-if="ev.resource_id" class="text-xs text-gray-400">#{{ ev.resource_id }}</span></td>
          <td class="table-td">
            <span class="badge" :class="ev.result === 'SUCCESS' ? 'bg-green-100 text-green-700 border border-green-200 dark:bg-green-900/30 dark:text-green-300 dark:border-green-800' : 'bg-red-100 text-red-700 border border-red-200 dark:bg-red-900/30 dark:text-red-300 dark:border-red-800'">
              <i :class="ev.result === 'SUCCESS' ? 'ph-check mr-1' : 'ph-x mr-1'"></i> {{ ev.result }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
    <pagination-controls
        category="audit"
        :current-page="currentPages.audit"
        :total-pages="auditTotalPages"
        @prev="prevPage('audit')"
        @next="nextPage('audit')" />
  </div>
</div>
