<!-- ==================== A0_Login.html — Authentication Screen ==================== -->
<div v-if="!session.token" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-emerald-950 via-teal-900 to-slate-900 p-4 relative overflow-hidden">
  <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl"></div>
  <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-teal-400/15 rounded-full blur-3xl"></div>

  <div class="bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-2xl w-full max-w-md dark:bg-slate-800/95 relative z-10 border border-white/20 dark:border-slate-700">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-emerald-50 text-emerald-600 mb-4 shadow-inner dark:bg-slate-700 dark:text-emerald-400">
        <i class="fa-solid fa-shield-halved text-4xl"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight">SI-PLATFORM</h1>
      <p class="text-xs font-semibold text-emerald-700 dark:text-emerald-400 mt-1 uppercase tracking-wider">Portal Single Sign-On & Hub Master</p>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Pemerintah Kabupaten Trenggalek</p>
    </div>

    <!-- Form Login Manual -->
    <form @submit.prevent="loginWithPassword" class="space-y-4">
      <div>
        <label class="form-label">Email atau Username</label>
        <input 
          v-model="loginForm.identifier" 
          type="text" 
          class="form-input" 
          placeholder="nama@trenggalekkab.go.id atau username" 
          required
        >
      </div>
      <div>
        <label class="form-label">Password</label>
        <input 
          v-model="loginForm.password" 
          type="password" 
          class="form-input" 
          placeholder="********" 
          required
        >
      </div>
      <button 
        type="submit" 
        class="w-full btn btn-primary py-3 text-sm flex justify-center items-center gap-2" 
        :disabled="loginLoading"
      >
        <i v-if="!loginLoading" class="fa-solid fa-right-to-bracket text-base"></i>
        <i v-else class="fa-solid fa-circle-notch animate-spin text-base"></i>
        <span>{{ loginLoading ? 'Memproses Autentikasi...' : 'Masuk ke Portal' }}</span>
      </button>
    </form>

    <!-- Divider -->
    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-slate-200 dark:border-slate-700"></div>
      </div>
      <div class="relative flex justify-center text-xs">
        <span class="px-3 bg-white text-slate-400 dark:bg-slate-800 dark:text-slate-500 font-semibold uppercase">atau</span>
      </div>
    </div>

    <!-- Login dengan Google -->
    <button 
      @click="login" 
      class="w-full btn btn-secondary py-3 text-sm flex justify-center items-center gap-2" 
      :disabled="loginLoading"
    >
      <i v-if="!loginLoading" class="fa-brands fa-google text-base text-rose-500"></i>
      <i v-else class="fa-solid fa-circle-notch animate-spin text-base"></i>
      <span>{{ loginLoading ? 'Menghubungkan...' : 'Login dengan Google SSO' }}</span>
    </button>

    <div v-if="loginError" class="mt-4 p-3 bg-rose-50 border border-rose-200 rounded-2xl flex items-start gap-2.5 text-rose-700 text-xs dark:bg-rose-900/30 dark:border-rose-800 dark:text-rose-300">
      <i class="fa-solid fa-circle-exclamation text-base shrink-0 mt-0.5"></i>
      <span>{{ loginError }}</span>
    </div>
  </div>
</div>
