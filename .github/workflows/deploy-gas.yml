name: Deploy to Google Apps Script (CI/CD)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Google Clasp
        run: sudo npm install -g @google/clasp

      - name: 🔑 Setup Clasp Authentication (.clasprc.json)
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const os = require('os');

            const raw = process.env.CLASPRC_JSON || '{}';
            let parsed = {};
            try { parsed = JSON.parse(raw); } catch (e) { parsed = {}; }

            const d = (parsed.tokens && parsed.tokens.default) || (parsed.token ? parsed : {});
            const clientId = d.client_id || (parsed.oauth2ClientSettings && parsed.oauth2ClientSettings.clientId) || '1072944905499-vm2v2i5dvn0a0d2o4ca36ilvge8cvbn0.apps.googleusercontent.com';
            const clientSecret = d.client_secret || (parsed.oauth2ClientSettings && parsed.oauth2ClientSettings.clientSecret) || 'v6V3fKV_zWU7iw1DrpOlRknX';
            const refreshToken = d.refresh_token || (parsed.token && parsed.token.refresh_token) || '';
            const accessToken = d.access_token || (parsed.token && parsed.token.access_token) || '';

            const hybridAuth = {
              token: {
                access_token: accessToken,
                scope: 'https://www.googleapis.com/auth/script.projects https://www.googleapis.com/auth/script.webapp.deploy https://www.googleapis.com/auth/drive.metadata.readonly https://www.googleapis.com/auth/cloud-platform',
                token_type: 'Bearer',
                expiry_date: Date.now() + 3600000,
                refresh_token: refreshToken
              },
              oauth2ClientSettings: {
                clientId: clientId,
                clientSecret: clientSecret,
                redirectUri: 'http://localhost'
              },
              isLocalCreds: false,
              tokens: {
                default: {
                  client_id: clientId,
                  client_secret: clientSecret,
                  type: 'authorized_user',
                  refresh_token: refreshToken,
                  access_token: accessToken
                }
              }
            };

            const destPath = path.join(os.homedir(), '.clasprc.json');
            fs.writeFileSync(destPath, JSON.stringify(hybridAuth, null, 2));
            console.log('✅ .clasprc.json hybrid config written successfully to', destPath);
          "
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

      - name: ⚙️ Setup Target Script ID
        run: |
          node -e "
            const fs = require('fs');
            const targetId = process.env.CLASP_SCRIPT_ID || process.env.GAS_SCRIPT_ID || '';
            if (targetId) {
              const clasp = fs.existsSync('.clasp.json') ? JSON.parse(fs.readFileSync('.clasp.json', 'utf8')) : { rootDir: 'src' };
              clasp.scriptId = targetId.trim();
              clasp.rootDir = 'src';
              fs.writeFileSync('.clasp.json', JSON.stringify(clasp, null, 2));
              console.log('✅ Target Script ID configured:', targetId);
            } else {
              console.log('ℹ️ Using scriptId from existing .clasp.json');
            }
          "
        env:
          CLASP_SCRIPT_ID: ${{ secrets.CLASP_SCRIPT_ID }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}

      - name: 🚀 Push Code to Google Apps Script
        run: clasp push --force
